auth_param basic program /usr/local/bin/de-proxy-auth
auth_param basic children 30 startup=5 idle=2
auth_param basic realm Digital Examen
auth_param basic credentialsttl 5 minutes
auth_param basic casesensitive off

external_acl_type de_policy ttl=10 negative_ttl=10 children-max=40 children-startup=4 %LOGIN %>rd /usr/local/bin/de-proxy-policy

acl de_users proxy_auth REQUIRED
acl de_allowed external de_policy

acl school_net src 10.0.0.0/8
acl school_net src 172.16.0.0/12
acl school_net src 192.168.0.0/16

acl bare_ip dstdom_regex ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_port 3128

http_access deny !school_net
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny bare_ip
http_access allow de_users de_allowed
http_access deny all

cache deny all
cache_mem 64 MB
maximum_object_size 0 KB

access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log

logfile_rotate 10
dns_v4_first on
forwarded_for delete
via off
httpd_suppress_version_string on
error_directory /usr/share/squid/errors/ru
